apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: streamlineops
  labels:
    app: notification-service
    team: platform
    version: "2.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        version: "2.1.0"
    spec:
      containers:
        - name: notification-service
          image: registry.streamlineops.io/notification-service:2.1.0
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: smtp-host
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: smtp-user
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: smtp-password
            - name: SMS_API_URL
              value: "https://sms-gateway.internal.streamlineops.io/v1/send"
            - name: SMS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: sms-api-key
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: streamlineops
spec:
  selector:
    app: notification-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
